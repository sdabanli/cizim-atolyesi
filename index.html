<style>
/* Düzen: ana sayfada kategori sekmeleri + resim kartları; derste solda büyük çizim sahnesi, sağda adım paneli (dikeyde alt alta). */
:root {
  --bg: #E7F2FF;
  --card: #FFFFFF;
  --ink: #17263F;
  --muted: #55667F;
  --line: #C9DAF0;
  --primary: #2F6BFF;
  --primary-ink: #FFFFFF;
  --hi: #FF4F81;
  --star: #FFB800;
  --good: #1FA36B;
  --font-display: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  font-weight: 600;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--hi); outline-offset: 3px; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* ---------- ana sayfa ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.top h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; letter-spacing: .01em; }
.progress { flex: 1 1 260px; max-width: 420px; display: flex; flex-direction: column; gap: 6px; }
.progress .txt { font-weight: 800; color: var(--muted); }
.bar { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .4s; }
.tabs { display: flex; flex-wrap: wrap; gap: 10px; }
.tab { border: 3px solid var(--line); background: var(--card); border-radius: 99px; padding: 10px 20px; font-weight: 800; min-height: 48px; }
.tab[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.tab.rand { margin-left: auto; background: var(--hi); border-color: var(--hi); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.card { position: relative; display: flex; flex-direction: column; gap: 6px; align-items: stretch; text-align: left; background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 12px 12px 14px; min-width: 0; }
.card:active { transform: scale(.97); }
.card .thumb { display: block; aspect-ratio: 1; border-radius: 14px; background: #F4F9FF; padding: 6px; }
.card .nm { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
.card .sub { font-size: .85rem; color: var(--muted); font-weight: 700; }
.card .badge { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; }

/* ---------- çizim (SVG) ---------- */
.art { display: block; width: 100%; height: 100%; }
.art .st * { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.art .now * { stroke: var(--hi); }
.art .st .f { fill: var(--ink); stroke: none; }
.art .now .f { fill: var(--hi); }

/* ---------- ders ---------- */
.lesson { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 820px) and (orientation: landscape) { .lesson { grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr); } }
.back { align-self: flex-start; border: 3px solid var(--line); background: var(--card); border-radius: 99px; padding: 10px 20px 10px 14px; font-weight: 800; min-height: 48px; display: inline-flex; gap: 8px; align-items: center; }
.stage { position: relative; aspect-ratio: 1; width: 100%; max-width: min(100%, 80vh); margin-inline: auto; background: #fff; border: 4px solid var(--ink); border-radius: 28px; overflow: hidden; }
.stage .art { position: absolute; inset: 0; padding: 4%; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel .kicker { font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-size: .85rem; }
.panel h2 { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 700; }
.say { font-family: var(--font-display); font-size: clamp(1.4rem, 3.2vw, 1.8rem); font-weight: 500; line-height: 1.3; background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 16px 18px; min-height: 5.6em; }
.sayrow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: stretch; }
.spk { width: 88px; border-radius: 22px; border: 0; background: var(--hi); color: #fff; font-size: 2.2rem; line-height: 1; padding: 0; }
.spk.on { outline: 4px solid var(--ink); outline-offset: 2px; }
.spk.off { opacity: .45; }
.dots { display: flex; flex-wrap: wrap; gap: 8px; }
.dots button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--line); background: var(--card); font-weight: 800; padding: 0; }
.dots button.on { background: var(--hi); border-color: var(--hi); color: #fff; }
.dots button.past { background: var(--ink); border-color: var(--ink); color: #fff; }
.nav { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
.btn { min-height: 68px; border-radius: 22px; border: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; padding: 12px 18px; }
.btn.prev { background: var(--card); border: 3px solid var(--line); }
.btn.next { background: var(--primary); color: var(--primary-ink); }
.btn.finish { background: var(--good); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.hint { color: var(--muted); font-size: .95rem; }

/* ---------- kutlama ---------- */
.win { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(23, 38, 63, .7); }
.win .box { position: relative; overflow: hidden; background: var(--card); border-radius: 32px; padding: 28px; text-align: center; max-width: 460px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.win .big { width: 120px; height: 120px; animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
.win h2 { font-size: 2.4rem; }
.win .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.win .row .btn { min-height: 56px; font-size: 1.15rem; }
.piece { position: absolute; top: -12px; width: 10px; height: 16px; border-radius: 3px; animation: fall 2.4s linear infinite; }
@keyframes fall { to { transform: translateY(520px) rotate(540deg); } }
@keyframes pop { from { transform: scale(.2) rotate(-30deg); } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 14px 22px; border-radius: 99px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { .piece, .win .big { animation: none; } .bar > i { transition: none; } }
</style>

    ["Yan yana üç bina çiz. Ortadaki en yüksek olsun.", rct(6, 40, 26, 56) + rct(36, 18, 28, 78) + rct(68, 52, 26, 44)],
    ["Binalara pencereler çiz.", wins(11, 46, 2, 3, 6, 6, 10, 12) + wins(41, 24, 2, 5, 6, 6, 12, 12) + wins(73, 58, 2, 2, 6, 6, 12, 12)],
    ["Her binaya bir kapı koy.", rct(14, 84, 10, 12) + rct(44, 82, 12, 14) + rct(76, 84, 10, 12)],
    ["Gökyüzüne bir ay çiz.", circ(84, 20, 9) + circ(80, 18, 1.4)],
    ["Yıldızlar ve yer çizgisi ekle.", dot(12, 14, 1.8) + dot(24, 26, 1.8) + dot(50, 8, 1.8) + dot(76, 36, 1.8) + ln(2, 97, 98, 97)]
  ]);

  var CATS = ["Hepsi", "Hayvanlar", "Deniz", "Taşıtlar", "Doğa", "Yiyecek", "Eşyalar", "Büyük resimler"];

  /* ---------- kayıt ---------- */
  var KEY = "cizim-atolyesi-bitenler";
  var done = [];
  try { done = JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (err) { done = []; }
  var saveDone = function () { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) { /* depolama kapalı */ } };

  /* ---------- yardımcılar ---------- */
  var app = document.getElementById("app");
  var find = function (id) { for (var i = 0; i < D.length; i++) if (D[i].id === id) return D[i]; return null; };
  var starSvg = function (cls) {
    return '<svg class="' + cls + '" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L62 37 L95 39 L69 60 L78 93 L50 74 L22 93 L31 60 L5 39 L38 37 Z" fill="var(--star)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/></svg>';
  };
  var art = function (d, upto, withNow) {
    var s = '<svg class="art" viewBox="0 0 100 100" role="img" aria-label="' + d.name + ' çizimi">';
    for (var i = 0; i < upto; i++) {
      s += '<g class="st' + (withNow && i === upto - 1 ? " now" : "") + '">' + d.steps[i][1] + "</g>";
    }
    return s + "</svg>";
  };
  var toast = function (msg) {
    var t = document.createElement("div");
    t.className = "toast";
    t.setAttribute("role", "status");
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 4200);
  };

  /* ---------- ana sayfa ---------- */
  var cat = "Hepsi";
  try { cat = sessionStorage.getItem("cizim-kategori") || "Hepsi"; } catch (err) { cat = "Hepsi"; }

  function home() {
    var list = D.filter(function (d) { return cat === "Hepsi" || d.cat === cat; });
    var n = done.filter(function (id) { return !!find(id); }).length;
    var html = '<div class="top"><h1>Çizim Atölyesi</h1><div class="progress"><div class="txt">' + D.length + " resimden " + n + " tanesini çizdin</div>" +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + D.length + '" aria-valuenow="' + n + '"><i style="width:' + Math.round(n / D.length * 100) + '%"></i></div></div></div>';
    html += '<div class="tabs" id="tabs">' + CATS.map(function (c) { return '<button class="tab" aria-pressed="' + (c === cat) + '" data-cat="' + c + '">' + c + "</button>"; }).join("") +
      '<button class="tab rand" id="rand">Bana bir resim seç</button></div>';
    html += '<div class="grid" id="grid">' + list.map(function (d) {
      var isDone = done.indexOf(d.id) >= 0;
      return '<button class="card" data-id="' + d.id + '"><span class="thumb">' + art(d, d.steps.length, false) + '</span><span class="nm">' + d.name + '</span><span class="sub">' + d.steps.length + " adım</span>" + (isDone ? starSvg("badge") : "") + "</button>";
    }).join("") + "</div>";
    app.innerHTML = html;
    document.getElementById("tabs").onclick = function (ev) {
      var b = ev.target.closest("button");
      if (!b) return;
      if (b.id === "rand") {
        var pool = D.filter(function (d) { return done.indexOf(d.id) < 0; });
        if (!pool.length) pool = D;
        location.hash = pool[Math.floor(Math.random() * pool.length)].id;
        return;
      }
      cat = b.getAttribute("data-cat");
      try { sessionStorage.setItem("cizim-kategori", cat); } catch (err) { /* önemli değil */ }
      home();
    };
    document.getElementById("grid").onclick = function (ev) {
      var b = ev.target.closest(".card");
      if (b) location.hash = b.getAttribute("data-id");
    };
  }

  /* ---------- ders ---------- */
  var cur = null, step = 1;

  function lesson(d) {
    cur = d; step = 1;
    app.innerHTML =
      '<button class="back" id="back">&#8592; Resimler</button>' +
      '<div class="lesson"><div class="stage" id="stage"></div>' +
      '<div class="panel"><div><div class="kicker" id="kick"></div><h2>' + d.name + "</h2></div>" +
      '<div class="sayrow"><div class="say" id="say" aria-live="polite"></div><button class="spk" id="spk" aria-label="Sesli oku">&#128266;</button></div><div class="dots" id="dots"></div>' +
      '<div class="nav"><button class="btn prev" id="prev">Geri</button><button class="btn next" id="next">Sonraki adım</button></div>' +
      '<div class="hint">iPad\'i sehpaya yasla, kâğıdı yanına koy ve kalemle çiz.</div></div></div>';
    document.getElementById("back").onclick = function () { stopSpeak(); location.hash = ""; };
    document.getElementById("prev").onclick = function () { if (step > 1) { step--; paint(); } };
    document.getElementById("next").onclick = function () {
      if (step < cur.steps.length) { step++; paint(); } else { finish(); }
    };
    document.getElementById("dots").onclick = function (ev) {
      var b = ev.target.closest("button");
      if (b) { step = +b.getAttribute("data-n"); paint(); }
    };
    document.getElementById("spk").onclick = function () {
      if (speaking) { voiceOn = false; stopSpeak(); } else { voiceOn = true; speak(); }
      saveVoice(); mark();
    };
    document.getElementById("say").onclick = function () { voiceOn = true; speak(); saveVoice(); mark(); };
    paint();
  }

  /* ---------- sesli okuma ---------- */
  var VKEY = "cizim-atolyesi-ses", voiceOn = true, speaking = false;
  try { voiceOn = localStorage.getItem(VKEY) !== "0"; } catch (err) {}
  var saveVoice = function () { try { localStorage.setItem(VKEY, voiceOn ? "1" : "0"); } catch (err) {} };
  var synth = window.speechSynthesis;

  function trVoice() {
    var vs = synth.getVoices() || [];
    for (var i = 0; i < vs.length; i++) if (/^tr/i.test(vs[i].lang)) return vs[i];
    return null;
  }
  function mark() {
    var b = document.getElementById("spk");
    if (!b) return;
    b.className = "spk" + (speaking ? " on" : voiceOn ? "" : " off");
  }
  function stopSpeak() { if (synth) synth.cancel(); speaking = false; mark(); }
  function speak() {
    if (!synth || !cur) return;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(cur.steps[step - 1][0]);
    u.lang = "tr-TR"; u.rate = 0.85; u.pitch = 1.1;
    var v = trVoice(); if (v) u.voice = v;
    u.onstart = function () { speaking = true; mark(); };
    u.onend = u.onerror = function () { speaking = false; mark(); };
    synth.speak(u);
  }
  if (synth && synth.addEventListener) synth.addEventListener("voiceschanged", function () {});

  function paint() {
    var d = cur, n = d.steps.length;
    document.getElementById("stage").innerHTML = art(d, step, true);
    document.getElementById("kick").textContent = "Adım " + step + " / " + n;
    document.getElementById("say").textContent = d.steps[step - 1][0];
    document.getElementById("dots").innerHTML = d.steps.map(function (_, i) {
      var k = i + 1;
      return '<button data-n="' + k + '" class="' + (k === step ? "on" : k < step ? "past" : "") + '" aria-label="Adım ' + k + '">' + k + "</button>";
    }).join("");
    document.getElementById("prev").disabled = step === 1;
    var nx = document.getElementById("next");
    if (step === n) { nx.textContent = "Bitti!"; nx.className = "btn finish"; }
    else { nx.textContent = "Sonraki adım"; nx.className = "btn next"; }
    if (voiceOn) speak(); else mark();
  }

  function finish() {
    if (done.indexOf(cur.id) < 0) { done.push(cur.id); saveDone(); }
    var colors = ["#FF4F81", "#2F6BFF", "#FFB800", "#1FA36B", "#9B5DE5"], conf = "";
    for (var i = 0; i < 28; i++) {
      conf += '<i class="piece" style="left:' + Math.round(Math.random() * 100) + "%;background:" + colors[i % 5] + ";animation-delay:" + (Math.random() * 2).toFixed(2) + 's"></i>';
    }
    var nDone = done.filter(function (id) { return !!find(id); }).length;
    var w = document.createElement("div");
    w.className = "win";
    w.setAttribute("role", "dialog");
    w.setAttribute("aria-label", "Tebrikler");
    w.innerHTML = '<div class="box">' + conf + starSvg("big") + "<h2>Harikasın!</h2><div>" + cur.name + " resmini bitirdin. " + D.length + " resimden " + nDone + " tanesini çizdin.</div>" +
      '<div class="row"><button class="btn prev" id="again">Tekrar çiz</button><button class="btn next" id="more">Başka resim</button></div></div>';
    document.body.appendChild(w);
    document.getElementById("again").onclick = function () { w.remove(); step = 1; paint(); };
    document.getElementById("more").onclick = function () { w.remove(); location.hash = ""; };
  }

  /* ---------- yönlendirme ---------- */
  function route() {
    stopSpeak();
    var id = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var d = id ? find(id) : null;
    var old = document.querySelector(".win");
    if (old) old.remove();
    if (d) lesson(d); else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
